<text dominant-baseline="central" text-anchor="middle" style="font-size:12px;font-family:Helvetica, Arial, sans-serif;" xml:space="preserve" y="36" transform="translate(490 20)" fill="#8d99ae">Conceptual ordering per FDA’s “continuum of risk” — combusted products are the most harmful;</text>
