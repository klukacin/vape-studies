name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          # workers.dev hostname is the deployment's own address, used by the
          # healthcheck below; enabling it is idempotent.
          curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vape-studies/subdomain" \
            -d '{"enabled":true,"previews_enabled":false}' > /dev/null

      # The Worker is verified on its own workers.dev hostname, which does not
      # depend on the custom domain's certificate; the public URL is reported.
      - name: Healthcheck
        run: |
          worker="https://vape-studies.nosco-703.workers.dev"
          public="https://vape-studies.research.lukacin.com"
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$worker/" || echo 000)
            [ "$code" = "200" ] && { echo "worker OK (200) $worker"; break; }
            echo "attempt $i: HTTP $code"; sleep 6
            [ "$i" = "10" ] && { echo "::error::worker healthcheck failed ($code)"; exit 1; }
          done
          for path in / /studije/ /studije/1/ /js/charts.js; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$worker$path" || echo 000)
            [ "$code" = "200" ] || { echo "::error::$path answered $code"; exit 1; }
          done
          echo "public $public -> HTTP $(curl -sS -o /dev/null -w '%{http_code}' "$public/" || echo 000)"